name: PR41 bounded Hook and type repair validation
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr41-bounded-repair-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch complete immutable source and checksum-locked edit manifest
        run: |
          set -eu
          git init source; cd source
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --depth=1 origin a5933d5da8ee23689746087427250c4760eb544c
          git checkout --detach FETCH_HEAD
          git fetch --depth=1 origin "$GITHUB_SHA"
          mkdir -p ../evidence
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          parts=[subprocess.check_output(['git','show',os.environ['GITHUB_SHA']+f':__tests__/review/pr41-manifest/part-{i:02d}']).strip() for i in range(1,10)]
          raw=gzip.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='69add373f280d8239b7f11a906ecc4523695c7ce6cb8ac5f75c6475c25c7e793'
          m=json.loads(raw)
          assert m['base']=='a5933d5da8ee23689746087427250c4760eb544c' and len(m['files'])==30
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==m['base']
          pathlib.Path('../evidence/manifest.json').write_bytes(raw)
          print('PASS immutable source and exact manifest checksum; complete public assets retained')
          PY
      - name: Install unchanged frozen tooling without lifecycle scripts or merchant secrets
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Record actual original lint failure without changing policy
        working-directory: source
        run: |
          set +e
          node node_modules/eslint/bin/eslint.js . --no-fix --format json --output-file ../evidence/lint-before.json > ../evidence/lint-before.log 2>&1
          code=$?
          echo "$code" > ../evidence/lint-before-exit.txt
          test "$code" -eq 1
      - name: Apply only checksum-locked source edits
        working-directory: source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          m=json.loads(pathlib.Path('../evidence/manifest.json').read_text());seen=set()
          for item in m['files']:
            p=pathlib.Path(item['path']);assert not p.is_absolute() and '..' not in p.parts and str(p) not in seen;seen.add(str(p))
            original=p.read_bytes() if p.exists() else None
            assert (hashlib.sha256(original).hexdigest() if original is not None else None)==item['before'],str(p)
            lines=(original.decode() if original is not None else '').splitlines(keepends=True);last=len(lines)
            for e in reversed(item['edits']):
              assert 0<=e['start']<=e['end']<=last
              lines[e['start']:e['end']]=[e['text']];last=e['start']
            content=''.join(lines).encode();assert hashlib.sha256(content).hexdigest()==item['after'],str(p)
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
            if original is None:subprocess.run(['git','add','-N',str(p)],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())==seen
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=D']).strip()
          assert all(p not in seen for p in ['package.json','pnpm-lock.yaml','eslint.config.mjs','tsconfig.json','vitest.config.ts','vitest.setup.ts','playwright.config.ts','messages/en.json','messages/ar.json'])
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('../evidence/changes.patch').write_bytes(subprocess.check_output(['git','diff','--no-ext-diff','--no-color']))
          print('PASS exactly 30 paths, no removals or configuration/catalog changes')
          PY
      - name: Verify application emission and narrow executable changes
        working-directory: source
        run: |
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),ts=require('typescript');
          const m=JSON.parse(fs.readFileSync('../evidence/manifest.json','utf8'));
          const expected=['components/product/product-description-accordion.tsx','lib/hooks/use-magnetic-cursor.ts'];const reports=[];
          const emit=(file,text)=>ts.transpileModule(text,{fileName:file,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX,removeComments:true}}).outputText;
          for(const item of m.files){
            if(item.path.startsWith('__tests__/')||item.path.endsWith('.d.ts'))continue;
            const before=cp.execFileSync('git',['show','HEAD:'+item.path],{encoding:'utf8'}),after=fs.readFileSync(item.path,'utf8');
            const same=emit(item.path,before)===emit(item.path,after);reports.push({file:item.path,emittedEquivalent:same});
            if(!expected.includes(item.path))assert.ok(same,'Unexpected executable change '+item.path);
            if(item.path===expected[0])assert.equal(after,before.replace('let introContent: string[] = []','const introContent: string[] = []'));
            if(item.path===expected[1])assert.equal(after,before.replace('useMotionValue, useSpring, useTransform, MotionValue','useMotionValue, useSpring, MotionValue').replace('  const rawScale = useMotionValue(1);','  const rawScale = useMotionValue(1);\n  const neutralScale = useMotionValue(1);').replace('scale: enableScale ? scale : useMotionValue(1)','scale: enableScale ? scale : neutralScale'));
          }
          fs.writeFileSync('../evidence/emission-review.json',JSON.stringify(reports,null,2));console.log(JSON.stringify(reports));
          JS
      - name: Type-check candidate under unchanged compiler policy
        working-directory: source
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false > ../evidence/typecheck.log 2>&1
      - name: Prepare external-request isolation outside application discovery
        working-directory: source
        run: |
          cat > ../no-network.cjs <<'JS'
          const fail=()=>{throw new Error('ISOLATED_TEST_EXTERNAL_NETWORK_BLOCKED');};
          for(const name of ['node:http','node:https']){const m=require(name);m.request=fail;m.get=fail;}
          const net=require('node:net'),original=net.Socket.prototype.connect;
          net.Socket.prototype.connect=function(...args){const t=args[0];if(typeof t==='string'&&t.startsWith('/'))return original.apply(this,args);if(t&&typeof t==='object'&&typeof t.path==='string')return original.apply(this,args);return fail();};
          require('node:tls').connect=fail;globalThis.fetch=async()=>fail();
          JS
      - name: Run unfiltered default test discovery on complete candidate
        working-directory: source
        run: |
          export NODE_OPTIONS="--require=$(pwd)/../no-network.cjs"
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=../evidence/full.json > ../evidence/full.log 2>&1
          node <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict'),r=JSON.parse(fs.readFileSync('../evidence/full.json','utf8'));
          const s={files:r.testResults.length,total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests};console.log(JSON.stringify(s));fs.writeFileSync('../evidence/test-summary.json',JSON.stringify(s,null,2));
          a.equal(s.files,68);a.equal(s.total,538);a.equal(s.passed,538);a.equal(s.failed,0);a.equal(s.pending,0);a.equal(new Set(r.testResults.map(x=>x.name)).size,68);
          JS
      - name: Repeat every modified test and new real Hook suite in randomized order
        working-directory: source
        run: |
          export NODE_OPTIONS="--require=$(pwd)/../no-network.cjs"
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const tests=JSON.parse(fs.readFileSync('../evidence/manifest.json','utf8')).files.map(x=>x.path).filter(x=>x.startsWith('__tests__/'));
          const out=fs.openSync('../evidence/shuffled.log','w');const r=cp.spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run',...tests,'--maxWorkers=2','--no-file-parallelism','--sequence.shuffle','--sequence.seed=4101','--reporter=json','--outputFile=../evidence/shuffled.json'],{stdio:['ignore',out,out]});fs.closeSync(out);assert.equal(r.status,0);
          const j=JSON.parse(fs.readFileSync('../evidence/shuffled.json','utf8'));assert.equal(j.numFailedTests,0);assert.equal(j.numPendingTests,0);console.log(JSON.stringify({files:j.testResults.length,passed:j.numPassedTests,failed:j.numFailedTests}));
          JS
      - name: Reproduce Hook-order failure on original source then restore exact candidate
        working-directory: source
        run: |
          export NODE_OPTIONS="--require=$(pwd)/../no-network.cjs"
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const p='lib/hooks/use-magnetic-cursor.ts',candidate=fs.readFileSync(p);
          try{
            fs.writeFileSync(p,cp.execFileSync('git',['show','HEAD:'+p]));
            const out=fs.openSync('../evidence/hook-original.log','w');const r=cp.spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run','__tests__/hooks/magnetic-cursor.test.tsx','--reporter=json','--outputFile=../evidence/hook-original.json'],{stdio:['ignore',out,out]});fs.closeSync(out);
            const j=JSON.parse(fs.readFileSync('../evidence/hook-original.json','utf8'));assert.equal(r.status,1);assert.equal(j.numTotalTests,6);assert.equal(j.numFailedTests,2);assert.equal(j.numPassedTests,4);assert.equal(j.numPendingTests,0);
            assert.ok(j.testResults.flatMap(f=>f.assertionResults).filter(x=>x.status==='failed').every(x=>x.fullName.includes('toggle scaling')));
            console.log('EXPECTED CONTROL: 4 pass / 2 Hook-order failures on unchanged original');
          }finally{fs.writeFileSync(p,candidate);}
          const m=JSON.parse(fs.readFileSync('../evidence/manifest.json','utf8'));for(const x of m.files)assert.equal(crypto.createHash('sha256').update(fs.readFileSync(x.path)).digest('hex'),x.after);
          JS
      - name: Capture remaining lint errors without suppression or false success
        working-directory: source
        run: |
          set +e
          node node_modules/eslint/bin/eslint.js . --no-fix --format json --output-file ../evidence/lint-after.json > ../evidence/lint-after.log 2>&1
          code=$?
          echo "$code" > ../evidence/lint-after-exit.txt
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),path=require('node:path');
          const before=JSON.parse(fs.readFileSync('../evidence/lint-before.json','utf8')),after=JSON.parse(fs.readFileSync('../evidence/lint-after.json','utf8'));
          const sum=r=>({files:r.length,errors:r.reduce((n,x)=>n+x.errorCount,0),warnings:r.reduce((n,x)=>n+x.warningCount,0)});
          const m=JSON.parse(fs.readFileSync('../evidence/manifest.json','utf8')),changed=new Set(m.files.map(x=>x.path));
          const oldByFile=new Map(before.map(x=>[path.relative(process.cwd(),x.filePath),x]));
          for(const f of after){const name=path.relative(process.cwd(),f.filePath);if(changed.has(name))assert.equal(f.errorCount,0,name);else if(f.errorCount){const old=oldByFile.get(name);assert.ok(old);assert.deepEqual(f.messages.filter(x=>x.severity===2),old.messages.filter(x=>x.severity===2));}}
          const report={before:sum(before),after:sum(after),modifiedFilesHaveZeroErrors:true,allRemainingErrorsIdenticalInUnchangedFiles:true,lintPass:false};
          assert.equal(report.before.errors,132);assert.equal(report.after.errors,76);assert.equal(Number(fs.readFileSync('../evidence/lint-after-exit.txt','utf8')),1);
          fs.writeFileSync('../evidence/lint-summary.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - name: Store verified inert Git blobs only; no commit, branch, merge or deployment
        working-directory: source
        env:
          BLOB_WRITE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          m=json.loads(pathlib.Path('../evidence/manifest.json').read_text());out=[]
          for x in m['files']:
            raw=pathlib.Path(x['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==x['after']
            payload=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode()
            request=urllib.request.Request('https://api.github.com/repos/ATP-Trading/commercemain/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['BLOB_WRITE_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'bounded-repair-verification'})
            with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
            expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest();assert result['sha']==expected
            out.append({'path':x['path'],'mode':'100644','type':'blob','sha':result['sha'],'sha256':x['after']})
          pathlib.Path('../evidence/verified-blobs.json').write_text(json.dumps({'base':m['base'],'manifestSha256':'69add373f280d8239b7f11a906ecc4523695c7ce6cb8ac5f75c6475c25c7e793','tree_elements':out},indent=2))
          print('Stored 30 immutable verified blobs. No Git ref or existing file was updated.')
          PY
      - name: Preserve verified results and all residual failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr41-bounded-repair-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Enforce the real lint release gate
        working-directory: source
        run: |
          code=$(cat ../evidence/lint-after-exit.txt)
          echo 'Tests and type-check were verified; full lint remains a failing release gate.'
          exit "$code"
