name: PR36 final exact-source and early-input verification
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr36-final-gates.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact candidate and check the five-file boundary
        run: |
          set -eu
          git init source; cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/fix/mobile-menu-stability-and-regression-tests
          git checkout --detach a6ec9e5cc380f11f0d367a767529df89a397f74c
          test "$(git rev-parse HEAD)" = a6ec9e5cc380f11f0d367a767529df89a397f74c
          node <<'JS'
          const cp=require('node:child_process'),assert=require('node:assert/strict');
          const expected=['components/layout/navbar/mobile-menu.tsx','__tests__/rtl/mobile-menu-route-stability.test.tsx','__tests__/rtl/mobile-menu-hydration.test.tsx','__tests__/seo/release-security.test.ts','__tests__/seo/member-cart-operations.test.ts'].sort();
          const changed=cp.execFileSync('git',['diff','--name-only','060397c03cdac89614b4ddd9f0569beff83c7aeb','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(changed,expected);
          assert.equal(cp.execFileSync('git',['diff','--name-only','--diff-filter=D','060397c03cdac89614b4ddd9f0569beff83c7aeb','HEAD'],{encoding:'utf8'}).trim(),'');
          console.log('PASS: only mobile-menu implementation and four test files changed; no file deletions or merchant changes.');
          JS
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
      - name: Install unchanged locked tools without lifecycle scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Prepare isolated network and result reporting
        working-directory: source
        run: |
          cat > .no-network.cjs <<'JS'
          const fail=()=>{throw new Error('FINAL_TEST_NETWORK_BLOCKED');};
          for(const n of ['node:http','node:https']){const t=require(n);t.request=fail;t.get=fail;}
          const net=require('node:net');net.connect=fail;net.createConnection=fail;
          require('node:tls').connect=fail;globalThis.fetch=async()=>fail();
          JS
          cat > .summarize.cjs <<'JS'
          const fs=require('node:fs');const p=process.argv[2];const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const s={source:'a6ec9e5cc380f11f0d367a767529df89a397f74c',report:p,success:r.success,files:r.testResults.length,total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,failedFiles:r.testResults.filter(f=>f.status==='failed').map(f=>({file:f.name,message:f.message,failures:f.assertionResults.filter(a=>a.status==='failed')}))};
          console.log(JSON.stringify(s,null,2));fs.writeFileSync(p.replace('.json','-summary.json'),JSON.stringify(s,null,2));
          JS
      - name: Run entire expanded selected scope on unmodified exact candidate
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/i18n __tests__/seo __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=final-exact.json >final-exact.log 2>&1
          code=$?
          node .summarize.cjs final-exact.json
          node <<'JS'
          const r=require('./final-exact.json'),assert=require('node:assert/strict');
          assert.equal(r.testResults.length,62);assert.equal(r.numTotalTests,450);assert.equal(r.numPendingTests,0);
          assert.ok(r.testResults.every(f=>f.name.includes('/source/__tests__/')));
          JS
          if [ "$code" -ne 0 ]; then tail -n 100 final-exact.log; fi
          exit "$code"
      - name: Randomized repeat of all four repaired and new test files
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/rtl/mobile-menu-route-stability.test.tsx __tests__/rtl/mobile-menu-hydration.test.tsx __tests__/seo/release-security.test.ts __tests__/seo/member-cart-operations.test.ts --maxWorkers=2 --sequence.shuffle --sequence.seed=3603 --reporter=json --outputFile=final-shuffled.json >final-shuffled.log 2>&1
          code=$?
          node .summarize.cjs final-shuffled.json
          exit "$code"
      - name: Reproduce the same six menu defects on original PR35 source then restore candidate
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          set -eu
          trap 'git checkout HEAD -- components/layout/navbar/mobile-menu.tsx' EXIT
          git show 060397c03cdac89614b4ddd9f0569beff83c7aeb:components/layout/navbar/mobile-menu.tsx > components/layout/navbar/mobile-menu.tsx
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/rtl/mobile-menu-route-stability.test.tsx __tests__/rtl/mobile-menu-hydration.test.tsx --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=final-baseline.json >final-baseline.log 2>&1
          code=$?
          set -e
          node .summarize.cjs final-baseline.json
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),r=require('./final-baseline.json');
          assert.equal(r.numTotalTests,16);assert.equal(r.numFailedTests,6);assert.equal(r.numPassedTests,10);assert.equal(r.numPendingTests,0);
          const s=JSON.parse(fs.readFileSync('final-baseline-summary.json','utf8'));s.source='060397c03cdac89614b4ddd9f0569beff83c7aeb';s.scope='Original PR35 menu under new regression tests; expected failing control, not a candidate pass';fs.writeFileSync('final-baseline-summary.json',JSON.stringify(s,null,2));
          JS
          test "$code" -ne 0
      - name: Upload reports only after tests, never copied tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-final-exact-evidence
          path: |
            source/final-*.json
            source/final-*.log
          retention-days: 3
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Prepare pinned authorized guest-browser harness without modifying application
        run: |
          set -eu
          git init source; cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/fix/mobile-menu-stability-and-regression-tests
          git checkout --detach a6ec9e5cc380f11f0d367a767529df89a397f74c
          git show "$GITHUB_SHA:__tests__/review/pr35-deployed-browser.cjs" > .handshake.cjs
          git show "$GITHUB_SHA:__tests__/review/pr35-browser-confirmation.cjs" > .final-browser.cjs
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');const p='.final-browser.cjs';let s=fs.readFileSync(p,'utf8');
          const replace=(a,b)=>{assert.ok(s.includes(a),'Missing anchor: '+a);s=s.replace(a,b);};
          replace("previewHost='commercemain-8cm9dnt1d-atp-trading.vercel.app'","previewHost='commercemain-7vf3gmf90-atp-trading.vercel.app'");
          replace('pr35-preview-envelope.json','pr36-final-envelope.json');
          replace("const req=route.request(),u=new URL(req.url());","const req=route.request(),u=new URL(req.url());\n  if(label==='slow-preview'&&u.origin===origin&&u.pathname.includes('/_next/')&&u.pathname.endsWith('.js')) await sleep(1500);");
          replace("for(const locale of ['en','ar']){","for(const [iteration,locale] of Array.from({length:label==='slow-preview'?3:10},(_,i)=>['en','ar'].map(l=>[i,l])).flat()){");
          replace('`${locale} mobile menu opens, shows guest login and closes`','`${locale} cycle ${iteration+1}: early click, stable open and explicit close`');
          replace("await page.goto(`${origin}/${locale}`,{waitUntil:'domcontentloaded',timeout:45000});","await page.goto(`${origin}/${locale}`,{waitUntil:'commit',timeout:45000});");
          replace("await close.waitFor({state:'visible',timeout:10000});","await close.waitFor({state:'visible',timeout:10000});\n    await page.waitForTimeout(900);\n    assert.ok(await close.isVisible(),'Menu closed without user action');");
          replace("for(const suffix of ['/atp-membership','/product/atp-membership'])","for(const suffix of (iteration===0?['/atp-membership','/product/atp-membership']:[]))");
          replace('const file=`${label}-${locale}-menu.png`;await page.screenshot({path:path.join(out,file)});result.screenshots.push(file);','if(iteration===0){const file=`${label}-${locale}-menu.png`;await page.screenshot({path:path.join(out,file)});result.screenshots.push(file);}');
          replace('const file2=`${label}-${locale}-home.png`;await page.screenshot({path:path.join(out,file2)});result.screenshots.push(file2);','if(iteration===0){const file2=`${label}-${locale}-home.png`;await page.screenshot({path:path.join(out,file2)});result.screenshots.push(file2);}');
          replace("return {viewport:'390x844',open:true,guestLogin:true,closed:true};","return {viewport:'390x844',cycle:iteration+1,jsDelayMs:label==='slow-preview'?1500:0,open:true,guestLogin:true,stableAfter900ms:true,closed:true};");
          replace("return {http:response?.status(),finalPath:new URL(page.url()).pathname,heading:await page.locator('main h1').first().innerText(),newErrors:result.pageErrors.slice(before).map(e=>e.message)};","assert.equal(response?.status(),200);\n    const heading=await page.locator('main h1').first().innerText();assert.ok(heading.trim());\n    assert.equal(result.pageErrors.length,before);\n    return {http:response.status(),finalPath:new URL(page.url()).pathname,heading,newErrors:[]};");
          replace("report.results.push(await inspect(browser,'production','https://www.atpgroupservices.ae','https://www.atpgroupservices.ae/en/auth/login'));","report.results.push(await inspect(browser,'slow-preview',`https://${previewHost}`,url));");
          replace("if(report.results.some(r=>r.failed||r.pageErrors.length||r.harnessError))process.exitCode=1;","if(report.results.length!==2||report.results[0]?.checks.length!==24||report.results[1]?.checks.length!==10||report.results.some(r=>r.failed||r.pageErrors.length||r.blockedRequests.length||r.harnessError))process.exitCode=1;");
          fs.writeFileSync(p,s);
          JS
      - name: Install unchanged pinned tooling and Chromium
        working-directory: source
        run: |
          npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Generate ephemeral public handshake
        working-directory: source
        run: node .handshake.cjs handshake
      - name: Publish public key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-final-public-handshake
          path: source/preview-public-handshake.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify current Preview with immediate normal and slow-JavaScript menu clicks
        working-directory: source
        run: node .final-browser.cjs
      - name: Remove ephemeral private key
        if: always()
        run: rm -f "$RUNNER_TEMP/pr35-preview-private.pem"
      - name: Upload all sanitized pass and fail evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-final-browser-evidence
          path: source/confirmation-evidence/
          retention-days: 3
          if-no-files-found: warn
