name: PR36 exact-source and repeated browser validation
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr36-exact-and-browser.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch exact candidate and independently verify change boundary
        run: |
          set -eu
          git init source; cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/fix/mobile-menu-stability-and-regression-tests
          git checkout --detach e47def917ac067f2ede3d05b22b0d2b302ff411a
          test "$(git rev-parse HEAD)" = e47def917ac067f2ede3d05b22b0d2b302ff411a
          node <<'JS'
          const cp=require('node:child_process'),assert=require('node:assert/strict'),fs=require('node:fs');
          const expected=['components/layout/navbar/mobile-menu.tsx','__tests__/rtl/mobile-menu-route-stability.test.tsx','__tests__/seo/release-security.test.ts','__tests__/seo/member-cart-operations.test.ts'].sort();
          const changed=cp.execFileSync('git',['diff','--name-only','060397c03cdac89614b4ddd9f0569beff83c7aeb','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(changed,expected);
          const before=cp.execFileSync('git',['show','060397c03cdac89614b4ddd9f0569beff83c7aeb:components/layout/navbar/mobile-menu.tsx'],{encoding:'utf8'});
          const after=before.replace('  const searchParams = useSearchParams()','  const searchParams = useSearchParams()\n  // Compare URL content, not object identity: same-URL refreshes must not close the menu.\n  const searchQuery = searchParams.toString()').replace('  }, [pathname, searchParams])','  }, [pathname, searchQuery])');
          assert.equal(fs.readFileSync('components/layout/navbar/mobile-menu.tsx','utf8'),after);
          console.log('PASS exact four-file boundary. Only application change is semantic query dependency.');
          JS
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
      - name: Install unchanged lockfile without scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Block external services in isolated tests
        working-directory: source
        run: |
          cat > .no-network.cjs <<'JS'
          const fail=()=>{throw new Error('TEST_NETWORK_BLOCKED');};
          for(const n of ['node:http','node:https']){const t=require(n);t.request=fail;t.get=fail;}
          const net=require('node:net');net.connect=fail;net.createConnection=fail;
          require('node:tls').connect=fail;globalThis.fetch=async()=>fail();
          JS
      - name: Execute all previously expanded tests and the new route-stability tests
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/i18n __tests__/seo __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=exact-results.json >exact.log 2>&1
          code=$?
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');const r=JSON.parse(fs.readFileSync('exact-results.json','utf8'));
          const summary={source:'e47def917ac067f2ede3d05b22b0d2b302ff411a',success:r.success,files:r.testResults.length,total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests};
          console.log(JSON.stringify(summary,null,2));fs.writeFileSync('exact-summary.json',JSON.stringify(summary,null,2));
          assert.equal(r.testResults.length,61);assert.equal(r.numTotalTests,448);assert.equal(r.numPendingTests,0);
          assert.ok(r.testResults.every(f=>f.name.includes('/source/__tests__/')));
          JS
          if [ "$code" -ne 0 ]; then tail -n 100 exact.log; fi
          exit "$code"
      - name: Repeat all three changed suites with randomized order
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/rtl/mobile-menu-route-stability.test.tsx __tests__/seo/release-security.test.ts __tests__/seo/member-cart-operations.test.ts --maxWorkers=2 --sequence.shuffle --sequence.seed=3602 --reporter=json --outputFile=exact-shuffled.json >exact-shuffled.log 2>&1
      - name: Preserve evidence after running tests, outside test discovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-exact-regression
          path: |
            source/exact*.json
            source/exact*.log
          retention-days: 3
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch exact candidate and preserved authorized browser harness
        run: |
          set -eu
          git init source; cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/fix/mobile-menu-stability-and-regression-tests
          git checkout --detach e47def917ac067f2ede3d05b22b0d2b302ff411a
          git show "$GITHUB_SHA:__tests__/review/pr35-deployed-browser.cjs" > .pr35-browser.cjs
          git show "$GITHUB_SHA:__tests__/review/pr35-browser-confirmation.cjs" > .pr36-confirmation.cjs
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');const p='.pr36-confirmation.cjs';let s=fs.readFileSync(p,'utf8');
          const replace=(a,b)=>{assert.ok(s.includes(a),'Missing harness anchor: '+a);s=s.replace(a,b);};
          replace("previewHost='commercemain-8cm9dnt1d-atp-trading.vercel.app'","previewHost='commercemain-94pi8kywx-atp-trading.vercel.app'");
          replace('pr35-preview-envelope.json','pr36-preview-envelope.json');
          replace("for(const locale of ['en','ar']){","for(const [iteration,locale] of Array.from({length:10},(_,i)=>['en','ar'].map(l=>[i,l])).flat()){");
          replace('`${locale} mobile menu opens, shows guest login and closes`','`${locale} cycle ${iteration+1}: mobile menu remains open and closes explicitly`');
          replace("await close.waitFor({state:'visible',timeout:10000});","await close.waitFor({state:'visible',timeout:10000});\n    await page.waitForTimeout(900);\n    assert.ok(await close.isVisible(),'Menu closed without user action');");
          replace("for(const suffix of ['/atp-membership','/product/atp-membership'])","for(const suffix of (iteration===0?['/atp-membership','/product/atp-membership']:[]))");
          replace('const file=`${label}-${locale}-menu.png`;await page.screenshot({path:path.join(out,file)});result.screenshots.push(file);','if(iteration===0){const file=`${label}-${locale}-menu.png`;await page.screenshot({path:path.join(out,file)});result.screenshots.push(file);}');
          replace('const file2=`${label}-${locale}-home.png`;await page.screenshot({path:path.join(out,file2)});result.screenshots.push(file2);','if(iteration===0){const file2=`${label}-${locale}-home.png`;await page.screenshot({path:path.join(out,file2)});result.screenshots.push(file2);}');
          replace("return {viewport:'390x844',open:true,guestLogin:true,closed:true};","return {viewport:'390x844',cycle:iteration+1,open:true,guestLogin:true,stableAfter900ms:true,closed:true};");
          fs.writeFileSync(p,s);
          JS
      - name: Install frozen browser tooling and Chromium
        working-directory: source
        run: |
          npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Generate ephemeral public handshake
        working-directory: source
        run: node .pr35-browser.cjs handshake
      - name: Upload public key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-browser-public-handshake
          path: source/preview-public-handshake.json
          retention-days: 1
          if-no-files-found: error
      - name: Repeat real mobile controls ten times per language on Preview and Production
        working-directory: source
        run: node .pr36-confirmation.cjs
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/pr35-preview-private.pem"
      - name: Preserve all browser pass/fail observations and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr36-repeated-browser-evidence
          path: source/confirmation-evidence/
          retention-days: 3
          if-no-files-found: warn
