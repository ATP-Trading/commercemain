name: PR37 exact translation cleanup validation
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr37-exact-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch immutable candidate and original source
        run: |
          set -eu
          git init source; cd source
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/retire-lingui-artifacts-and-test-fixture refs/heads/test/pr30-isolated-validation
          git checkout --detach d5b6ac616704c0eb4a77d015309cdd22bfff120c
          test "$(git rev-parse HEAD)" = d5b6ac616704c0eb4a77d015309cdd22bfff120c
          git worktree add --detach ../baseline a6ec9e5cc380f11f0d367a767529df89a397f74c
          mkdir -p ../evidence
      - name: Install unchanged frozen test tooling
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Verify full original-source imports and preserve unrelated global contracts
        id: audit
        working-directory: source
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict'),ts=require('typescript');
          const base='a6ec9e5cc380f11f0d367a767529df89a397f74c';
          const removed=['components/membership/atp-membership-dashboard.tsx','src/i18n/types.ts','src/i18n/lingui-types.d.ts','types/lingui.d.ts','lingui.config.ts','src/locales/ar/messages.js','src/locales/ar/messages.po','src/locales/ar/messages_hero.po','src/locales/en/messages.js','src/locales/en/messages.po'];
          const changed=['__tests__/__mocks__/test-providers.tsx','__tests__/accessibility/membership-components.test.tsx','global.d.ts','tsconfig.json','__tests__/config/test-config.ts','scripts/deploy-membership-system.js','src/i18n/README.md','__tests__/i18n/legacy-artifacts-retirement.test.ts'];
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'});
          assert.deepEqual(git('diff','--name-only',base,'HEAD').trim().split('\n').sort(),[...removed,...changed].sort());
          assert.deepEqual(git('diff','--name-only','--diff-filter=D',base,'HEAD').trim().split('\n').sort(),removed.sort());
          for(const f of ['__tests__/config/test-config.ts','scripts/deploy-membership-system.js']){
            const before=git('show',`${base}:${f}`), after=fs.readFileSync(f,'utf8');
            const line=f.endsWith('.ts')?"      'AtpMembershipDashboard',\n":"    'components/membership/atp-membership-dashboard.tsx',\n";
            assert.equal(after,before.replace(line,''));
          }
          const beforeGlobal=git('show',`${base}:global.d.ts`),afterGlobal=fs.readFileSync('global.d.ts','utf8');
          const tamara=s=>s.match(/"tamara-widget": \{[\s\S]*?\n      \};/)[0];
          assert.equal(tamara(beforeGlobal),tamara(afterGlobal));
          const oldConfig=ts.parseConfigFileTextToJson('tsconfig.json',git('show',`${base}:tsconfig.json`)).config;
          const newConfig=ts.readConfigFile('tsconfig.json',ts.sys.readFile).config;
          assert.deepEqual(newConfig.compilerOptions,oldConfig.compilerOptions);
          assert.deepEqual(newConfig.exclude,oldConfig.exclude);
          assert.deepEqual(newConfig.include,oldConfig.include.filter(f=>f!=='src/i18n/lingui-types.d.ts'));
          assert.equal(git('diff',base,'HEAD','--','app','hooks','lib','messages','components/membership/membership-badge.tsx','components/membership/member-pricing.tsx','components/layout/navbar/mobile-menu.tsx','types/tamara-widget.d.ts','package.json','pnpm-lock.yaml','next.config.ts'),'');
          const root=path.resolve('../baseline');
          const files=cp.execFileSync('git',['ls-files','-z'],{cwd:root,encoding:'utf8'}).split('\0').filter(Boolean);
          const config=ts.readConfigFile(path.join(root,'tsconfig.json'),ts.sys.readFile);
          const parsed=ts.parseJsonConfigFileContent(config.config,ts.sys,root);
          const allowed=new Set([...removed,...changed]);const incoming=[],dynamic=[];
          for(const file of files.filter(f=>/\.[cm]?[jt]sx?$/.test(f))){
            const ast=ts.createSourceFile(file,fs.readFileSync(path.join(root,file),'utf8'),ts.ScriptTarget.Latest,true);
            function visit(n){
              if(ts.isStringLiteralLike(n)){
                const r=ts.resolveModuleName(n.text,path.join(root,file),parsed.options,ts.sys).resolvedModule;
                if(r){const target=path.relative(root,r.resolvedFileName);if(removed.includes(target))incoming.push({file,target,allowed:allowed.has(file)});}
              }
              if(ts.isCallExpression(n)&&(n.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(n.expression)&&n.expression.text==='require'))&&n.arguments[0]&&!ts.isStringLiteralLike(n.arguments[0])&&!removed.includes(file))dynamic.push({file,expression:n.getText(ast)});
              ts.forEachChild(n,visit);
            }visit(ast);
          }
          assert.deepEqual(incoming.filter(r=>!r.allowed),[]);
          assert.ok(dynamic.every(r=>r.file==='src/i18n/request.ts'&&r.expression.includes('../../messages/')));
          const result={source:git('rev-parse','HEAD').trim(),base,trackedOriginal:files.length,removed,incoming,dynamic,compilerOptionsUnchanged:true,tamaraContractUnchanged:true,activeRuntimeUnchanged:true};
          fs.writeFileSync('../evidence/scope-audit.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          JS
      - name: Type-check after removing stub declarations
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        working-directory: source
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --incremental false >../evidence/typescript.log 2>&1
          status=$?
          echo "$status" >../evidence/typescript-exit-code.txt
          cat ../evidence/typescript.log
          exit "$status"
      - name: Install isolated network guard and existing auth interaction tests
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        id: prepare
        working-directory: source
        run: |
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
          cat > .no-network.cjs <<'JS'
          const fail=()=>{throw new Error('PR37_ISOLATED_NETWORK_BLOCKED');};
          for(const name of ['node:http','node:https']){const t=require(name);t.request=fail;t.get=fail;}
          const net=require('node:net');net.connect=fail;net.createConnection=fail;require('node:tls').connect=fail;globalThis.fetch=async()=>fail();
          JS
          cat > .summary.cjs <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),file=process.argv[2];
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          const result={source:'d5b6ac616704c0eb4a77d015309cdd22bfff120c',success:r.success,files:r.testResults.length,tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,failedFiles:r.testResults.filter(f=>f.status==='failed').map(f=>({file:f.name,message:f.message,failed:f.assertionResults.filter(a=>a.status==='failed')}))};
          fs.writeFileSync(file.replace('.json','-summary.json'),JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          if(process.argv[3])assert.equal(r.testResults.length,Number(process.argv[3]));
          if(process.argv[4])assert.equal(r.numTotalTests,Number(process.argv[4]));
          JS
      - name: Run previous expanded scope and migrated accessibility suite without duplicate discovery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set +e
          NODE_OPTIONS="--require=$(pwd)/.no-network.cjs" ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/i18n __tests__/seo __tests__/accessibility/membership-components.test.tsx __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=../evidence/expanded.json >../evidence/expanded.log 2>&1
          status=$?
          node .summary.cjs ../evidence/expanded.json 64 479 || exit 1
          exit "$status"
      - name: Repeat all translation and migrated accessibility checks in randomized order
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set +e
          NODE_OPTIONS="--require=$(pwd)/.no-network.cjs" ./node_modules/.bin/vitest run __tests__/i18n __tests__/accessibility/membership-components.test.tsx --maxWorkers=2 --no-file-parallelism --sequence.shuffle --sequence.seed=3701 --reporter=json --outputFile=../evidence/shuffled.json >../evidence/shuffled.log 2>&1
          status=$?
          node .summary.cjs ../evidence/shuffled.json 6 61 || exit 1
          exit "$status"
      - name: Preserve every test result and exact diff outside test discovery
        if: always()
        working-directory: source
        run: |
          git diff a6ec9e5cc380f11f0d367a767529df89a397f74c HEAD >../evidence/cleanup.patch
          git diff --stat a6ec9e5cc380f11f0d367a767529df89a397f74c HEAD >../evidence/diff-stat.txt
      - name: Upload audit and actual results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr37-exact-validation
          path: evidence/
          retention-days: 3
          if-no-files-found: error
