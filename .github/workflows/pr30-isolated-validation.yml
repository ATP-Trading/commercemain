name: Legacy customer API dependency audit

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch immutable PR32 source without merchant credentials
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/retire-password-auth-hook
          git checkout --detach 16a33a143c76e9f74629d115cb0eed2b4f8b9914
          test "$(git rev-parse HEAD)" = 16a33a143c76e9f74629d115cb0eed2b4f8b9914
      - name: Install unchanged locked audit tooling without lifecycle scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts
      - name: Audit complete checkout including import aliases types scripts and ambient declarations
        working-directory: source
        run: |
          set -o pipefail
          node <<'JS' | tee legacy-customer-api-audit.json
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const ts = require('typescript');
          const root = process.cwd();
          const targets = ['lib/shopify/customer-account.ts','lib/shopify/customer-account-server.ts'];
          const absoluteTargets = new Set(targets.map(f=>path.resolve(f)));
          const cfg = ts.readConfigFile('tsconfig.json',ts.sys.readFile);
          if(cfg.error) throw new Error(ts.flattenDiagnosticMessageText(cfg.error.messageText,'\n'));
          const parsed = ts.parseJsonConfigFileContent(cfg.config,ts.sys,root);
          if(parsed.errors.length) throw new Error('Invalid project tsconfig');
          const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const files = tracked.filter(f=>/\.(?:[cm]?[jt]sx?|md|json|ya?ml)$/.test(f)&&!/(?:^|\/)(?:package-lock\.json|pnpm-lock\.yaml)$/.test(f));
          const symbols = new Set();
          const declarations = {};
          for(const file of targets) {
            const source = ts.createSourceFile(file,fs.readFileSync(file,'utf8'),ts.ScriptTarget.Latest,true);
            const exported = source.statements.filter(n=>n.modifiers?.some(m=>m.kind===ts.SyntaxKind.ExportKeyword)).flatMap(n=>n.name?[n.name.text]:[]);
            exported.forEach(name=>symbols.add(name));
            const ambient=[];
            function inspect(n) { if(ts.isModuleDeclaration(n)) ambient.push({line:source.getLineAndCharacterOfPosition(n.getStart()).line+1,name:n.name.getText(source)}); ts.forEachChild(n,inspect); }
            inspect(source);
            declarations[file] = {lines:source.text.split('\n').length,exports:exported,ambientDeclarations:ambient};
          }
          const resolvedReferences=[],textReferences=[],symbolReferences=[],nonLiteralLoaders=[];
          const cache=ts.createModuleResolutionCache(root,p=>p,parsed.options);
          for(const file of files) {
            const text=fs.readFileSync(file,'utf8');
            if(!targets.includes(file)) text.split('\n').forEach((line,i)=>{
              if(/\bcustomer-account(?:-server)?(?:\b|\/)/.test(line)&&!/customer-account-oauth|customer-account-api/.test(line)) textReferences.push({file,line:i+1});
              for(const name of symbols) if(new RegExp('\\b'+name+'\\b').test(line)) symbolReferences.push({file,line:i+1,symbol:name});
            });
            if(!/\.[cm]?[jt]sx?$/.test(file)) continue;
            const source=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true);
            function walk(n) {
              if(ts.isStringLiteralLike(n)) {
                const resolved=ts.resolveModuleName(n.text,path.resolve(file),parsed.options,ts.sys,cache).resolvedModule;
                if(resolved&&absoluteTargets.has(path.resolve(resolved.resolvedFileName))) resolvedReferences.push({file,line:source.getLineAndCharacterOfPosition(n.getStart()).line+1,specifier:n.text,target:path.relative(root,resolved.resolvedFileName)});
              }
              if(ts.isCallExpression(n)&&(n.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(n.expression)&&n.expression.text==='require'))&&(!n.arguments[0]||!ts.isStringLiteralLike(n.arguments[0]))) nonLiteralLoaders.push({file,line:source.getLineAndCharacterOfPosition(n.getStart()).line+1,expression:n.getText(source).slice(0,180)});
              ts.forEachChild(n,walk);
            }
            walk(source);
          }
          console.log(JSON.stringify({source:'16a33a143c76e9f74629d115cb0eed2b4f8b9914',trackedFiles:tracked.length,scannedTextFiles:files.length,declarations,resolvedReferences,textReferences,symbolReferences,nonLiteralLoaders,scope:'Static source audit only; no application, customer, auth, Shopify or payment functions executed.'},null,2));
          JS
      - name: Record auditable result
        working-directory: source
        run: |
          { echo '## Legacy customer API dependency audit'; echo '```json'; cat legacy-customer-api-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
