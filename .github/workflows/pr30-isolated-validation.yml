name: Legacy auth dependency audit

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch the exact tested source
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/repair-stale-regression-tests
          git checkout --detach b54d62c44e4f660c57f1636a16259d28132cbdb3
          test "$(git rev-parse HEAD)" = b54d62c44e4f660c57f1636a16259d28132cbdb3
      - name: Install locked tooling without lifecycle scripts or merchant secrets
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts
      - name: Inspect all tracked sources without executing application code
        working-directory: source
        run: |
          node <<'JS' | tee legacy-auth-audit.json
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const ts = require('typescript');
          const root = process.cwd();
          const target = path.resolve('hooks/use-customer.ts');
          const cfg = ts.readConfigFile('tsconfig.json', ts.sys.readFile);
          if (cfg.error) throw new Error(ts.flattenDiagnosticMessageText(cfg.error.messageText,'\n'));
          const parsed = ts.parseJsonConfigFileContent(cfg.config, ts.sys, root);
          const files = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const refs = [], imports = [], ambient = [], dynamic = [];
          const needles = [ ['legacyHook',/\buseCustomer\b|use-customer(?!-oauth)/], ['authHelpers',/auth-utils|\blogAuthStatus\b|\bhandleAuthError\b/], ['legacyEndpoints',/\/api\/customer\/(?:login|logout|register|password-reset)(?:\b|\/)/] ];
          const sourceFiles = files.filter(f=>/\.(?:[cm]?[jt]sx?|md|json|ya?ml)$/.test(f)&&!/(?:^|\/)(?:package-lock\.json|pnpm-lock\.yaml)$/.test(f));
          for (const file of sourceFiles) {
            const content = fs.readFileSync(file,'utf8');
            content.split('\n').forEach((line,i)=>{
              for(const [kind,needle] of needles) if(needle.test(line)) refs.push({kind,file,line:i+1});
            });
            if(!/\.[cm]?[jt]sx?$/.test(file)) continue;
            const sf = ts.createSourceFile(file,content,ts.ScriptTarget.Latest,true);
            function walk(n) {
              if(ts.isStringLiteralLike(n)) {
                const resolved = ts.resolveModuleName(n.text,path.resolve(file),parsed.options,ts.sys).resolvedModule;
                if(resolved && path.resolve(resolved.resolvedFileName) === target) imports.push({file,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1,specifier:n.text});
              }
              if(file==='hooks/use-customer.ts'&&ts.isModuleDeclaration(n)) ambient.push(n.getText(sf));
              if(ts.isCallExpression(n) && n.expression.kind===ts.SyntaxKind.ImportKeyword && (!n.arguments[0] || !ts.isStringLiteralLike(n.arguments[0]))) dynamic.push({file,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1,expression:n.getText(sf).slice(0,160)});
              ts.forEachChild(n,walk);
            }
            walk(sf);
          }
          const result={source:'b54d62c44e4f660c57f1636a16259d28132cbdb3',trackedFiles:files.length,scannedTextFiles:sourceFiles.length,legacyHookIncludedByTsconfig:parsed.fileNames.includes(target),legacyHookLines:fs.readFileSync(target,'utf8').split('\n').length,importsResolvingToLegacyHook:imports,ambientDeclarationsInLegacyHook:ambient,allLegacyReferences:refs,nonLiteralDynamicImports:dynamic,scope:'Static audit of complete pinned checkout including tests and scripts; no application execution, secrets or API requests.'};
          console.log(JSON.stringify(result,null,2));
          JS
      - name: Record audit scope
        if: always()
        working-directory: source
        run: |
          { echo '## Legacy auth dependency audit'; echo '```json'; cat legacy-auth-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
