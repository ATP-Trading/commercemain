name: Legacy translation core audit
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch immutable PR34 source
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/retire-unused-lingui-ui
          git checkout --detach 0d71a61ba3626faed096911d15bdda90432f49a8
          test "$(git rev-parse HEAD)" = 0d71a61ba3626faed096911d15bdda90432f49a8
      - name: Install unchanged locked static-analysis tooling
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Verify removal boundary and preserve unrelated global declarations
        working-directory: source
        run: |
          set -o pipefail
          node <<'JS' | tee translation-core-audit.json
          const fs=require('node:fs'),path=require('node:path'),ts=require('typescript');
          const {execFileSync}=require('node:child_process');
          const root=process.cwd();
          const runtime=['src/i18n/LinguiClientProvider.tsx','src/i18n/dev-tools.ts','src/i18n/index.ts','src/i18n/message-utils.ts','src/i18n/server.ts','src/i18n/useSafeLingui.ts','src/i18n/navigation-server.ts'];
          const retiredTests=['__tests__/i18n/LinguiClientProvider.test.tsx','__tests__/i18n/server.test.ts','__tests__/i18n/typescript-integration.test.ts'];
          const boundary=new Set([...runtime,...retiredTests]);
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const cfg=ts.readConfigFile('tsconfig.json',ts.sys.readFile);
          if(cfg.error)throw new Error('Invalid tsconfig');
          const parsed=ts.parseJsonConfigFileContent(cfg.config,ts.sys,root);
          if(parsed.errors.length)throw new Error('Invalid tsconfig');
          const cache=ts.createModuleResolutionCache(root,p=>p,parsed.options);
          const incoming=[],ambient=[],mentions=[],dynamic=[];
          for(const file of files.filter(f=>/\.(?:[cm]?[jt]sx?|md|json|ya?ml|po)$/.test(f)&&!/(?:pnpm-lock\.yaml|package-lock\.json)$/.test(f))){
            const text=fs.readFileSync(file,'utf8');
            if(!boundary.has(file))text.split('\n').forEach((line,i)=>{
              if(/LinguiClientProvider|useSafeLingui|src\/i18n(?:['"]|\/index|\/server|\/dev-tools|\/message-utils|\/navigation-server)|__LINGUI|tamara-widget/.test(line))mentions.push({file,line:i+1,text:line.trim().slice(0,180)});
            });
            if(!/\.[cm]?[jt]sx?$/.test(file))continue;
            const sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true);
            function visit(n){
              if(ts.isStringLiteralLike(n)){
                const r=ts.resolveModuleName(n.text,path.resolve(file),parsed.options,ts.sys,cache).resolvedModule;
                const target=r?path.relative(root,r.resolvedFileName):null;
                if(target&&runtime.includes(target)&&!boundary.has(file))incoming.push({file,target,specifier:n.text,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1});
              }
              if(runtime.includes(file)&&ts.isModuleDeclaration(n))ambient.push({file,name:n.name.getText(sf)});
              if(ts.isCallExpression(n)&&(n.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(n.expression)&&n.expression.text==='require'))&&(!n.arguments[0]||!ts.isStringLiteralLike(n.arguments[0]))&&!boundary.has(file))dynamic.push({file,expression:n.getText(sf).slice(0,180)});
              ts.forEachChild(n,visit);
            }
            visit(sf);
          }
          const result={source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),trackedFiles:files.length,runtime:runtime.map(file=>({file,lines:fs.readFileSync(file,'utf8').split('\n').length})),retiredTests,incomingOutsideBoundary:incoming,ambientInRemoval:ambient,remainingDynamicImports:dynamic,remainingMentions:mentions,scope:'Static audit only; shared type files and test-providers remain outside deletion scope. No application execution, merchant secrets or live requests.'};
          console.log(JSON.stringify(result,null,2));
          if(incoming.length||ambient.length)process.exit(1);
          JS
      - name: Record exact audit
        if: always()
        working-directory: source
        run: |
          if [ -f translation-core-audit.json ]; then
            { echo '## Translation core audit'; echo '```json'; cat translation-core-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
