name: PR35 deployed browser and expanded regression checks
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch pinned application and immutable verification script
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/cleanup/retire-lingui-runtime
          git checkout --detach 060397c03cdac89614b4ddd9f0569beff83c7aeb
          test "$(git rev-parse HEAD)" = 060397c03cdac89614b4ddd9f0569beff83c7aeb
          git show "$GITHUB_SHA:__tests__/review/pr35-deployed-browser.cjs" > .pr35-browser.cjs
      - name: Install pinned tooling and Chromium only
        working-directory: source
        run: |
          npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Generate ephemeral public authorization handshake
        working-directory: source
        run: node .pr35-browser.cjs handshake
      - name: Publish PUBLIC key only for encrypted delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-preview-public-handshake
          path: source/preview-public-handshake.json
          retention-days: 1
          if-no-files-found: error
      - name: Follow authorized Preview cookies in real Chromium and test guest pages
        working-directory: source
        run: node .pr35-browser.cjs run
      - name: Remove ephemeral private key even on cancellation
        if: always()
        run: rm -f "$RUNNER_TEMP/pr35-preview-private.pem"
      - name: Publish sanitized browser report and storefront screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-deployed-browser-evidence
          path: source/browser-evidence/
          retention-days: 1
          if-no-files-found: warn
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch exact PR35 source and existing UI tests
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/cleanup/retire-lingui-runtime
          git checkout --detach 060397c03cdac89614b4ddd9f0569beff83c7aeb
          test "$(git rev-parse HEAD)" = 060397c03cdac89614b4ddd9f0569beff83c7aeb
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
      - name: Install unchanged frozen tooling without scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Block external access in isolated tests
        working-directory: source
        run: |
          cat > .no-network.cjs <<'JS'
          const fail=()=>{throw new Error('ISOLATED_TEST_NETWORK_BLOCKED');};
          for(const name of ['node:http','node:https']){const transport=require(name);transport.request=fail;transport.get=fail;}
          const net=require('node:net');net.connect=fail;net.createConnection=fail;
          require('node:tls').connect=fail;globalThis.fetch=async()=>fail();
          JS
      - name: Run previous scope plus ALL SEO tests and existing EN AR UI checks
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/i18n __tests__/seo __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=expanded-results.json >expanded.log 2>&1
          result=$?
          node <<'JS'
          const fs=require('node:fs');
          if(!fs.existsSync('expanded-results.json'))process.exit(1);
          const r=JSON.parse(fs.readFileSync('expanded-results.json','utf8'));
          const report={source:'060397c03cdac89614b4ddd9f0569beff83c7aeb',success:r.success,files:r.testResults.length,tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,failedFiles:r.testResults.filter(f=>f.status==='failed').map(f=>({file:f.name.split('/source/').pop(),message:f.message,assertions:f.assertionResults.filter(a=>a.status==='failed')}))};
          fs.writeFileSync('expanded-summary.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
          exit "$result"
      - name: Preserve exact test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-expanded-regression-evidence
          path: |
            source/expanded-summary.json
            source/expanded-results.json
            source/expanded.log
          retention-days: 1
          if-no-files-found: warn
