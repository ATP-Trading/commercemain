name: Legacy translation dependency audit

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch the exact PR33 source without merchant credentials
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/retire-legacy-customer-api-clients
          git checkout --detach eec6a5e00e6c961a4468c365e3f99b7f367253b8
          test "$(git rev-parse HEAD)" = eec6a5e00e6c961a4468c365e3f99b7f367253b8
      - name: Install unchanged locked static-analysis tooling
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Inspect all tracked source and configuration without executing the app
        working-directory: source
        run: |
          set -o pipefail
          node <<'JS' | tee translation-audit.json
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const ts = require('typescript');
          const root = process.cwd();
          const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const textFiles = tracked.filter(f=>/\.(?:[cm]?[jt]sx?|md|json|ya?ml|po)$/.test(f)&&!/(?:^|\/)(?:package-lock\.json|pnpm-lock\.yaml)$/.test(f));
          const live = new Set(['src/i18n/navigation.ts','src/i18n/navigation-server.ts','src/i18n/routing.ts','src/i18n/request.ts']);
          const candidates = tracked.filter(f=>f.startsWith('src/i18n/')&&/\.[cm]?[jt]sx?$/.test(f)&&!live.has(f));
          const candidateSet = new Set(candidates);
          const cfg = ts.readConfigFile('tsconfig.json',ts.sys.readFile);
          if(cfg.error) throw new Error('Unable to read tsconfig');
          const parsed = ts.parseJsonConfigFileContent(cfg.config,ts.sys,root);
          if(parsed.errors.length) throw new Error('Invalid tsconfig');
          const cache = ts.createModuleResolutionCache(root,p=>p,parsed.options);
          const incoming=[],outgoing=[],ambient=[],mentions=[],dynamic=[],linguiImports=[],declarations=[];
          for(const file of textFiles) {
            const content = fs.readFileSync(file,'utf8');
            if(!candidateSet.has(file)) content.split('\n').forEach((line,i)=>{
              if(/lingui|Lingui|I18nReady|I18nErrorBoundary|useSafeLingui|src\/i18n(?:['"`\s]|$)|i18n\/(?:types|server|message-utils|dev-tools|index)/.test(line)) mentions.push({file,line:i+1,text:line.trim().slice(0,180)});
            });
            if(!/\.[cm]?[jt]sx?$/.test(file)) continue;
            const sf = ts.createSourceFile(file,content,ts.ScriptTarget.Latest,true);
            if(candidateSet.has(file)) declarations.push({file,lines:content.split('\n').length,exports:sf.statements.filter(n=>n.modifiers?.some(m=>m.kind===ts.SyntaxKind.ExportKeyword)).flatMap(n=>n.name?[n.name.text]:[])});
            function visit(n) {
              if(ts.isStringLiteralLike(n)) {
                const r=ts.resolveModuleName(n.text,path.resolve(file),parsed.options,ts.sys,cache).resolvedModule;
                const to=r?path.relative(root,r.resolvedFileName):null;
                if(to&&candidateSet.has(to)) incoming.push({from:file,to,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1,specifier:n.text});
                if(to&&candidateSet.has(file)&&!candidateSet.has(to)&&!to.startsWith('node_modules/')) outgoing.push({from:file,to,specifier:n.text});
                if(n.text.startsWith('@lingui/')) linguiImports.push({file,specifier:n.text});
              }
              if(candidateSet.has(file)&&ts.isModuleDeclaration(n)) ambient.push({file,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1,name:n.name.getText(sf),global:!!(n.flags&ts.NodeFlags.GlobalAugmentation)});
              if(ts.isCallExpression(n)&&(n.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(n.expression)&&n.expression.text==='require'))&&(!n.arguments[0]||!ts.isStringLiteralLike(n.arguments[0]))) dynamic.push({file,line:sf.getLineAndCharacterOfPosition(n.getStart()).line+1,expression:n.getText(sf).slice(0,160)});
              ts.forEachChild(n,visit);
            }
            visit(sf);
          }
          const result={source:'eec6a5e00e6c961a4468c365e3f99b7f367253b8',trackedFiles:tracked.length,scannedFiles:textFiles.length,candidates:declarations,incoming,outgoing,ambient,linguiImports,mentions,dynamic,localeFiles:tracked.filter(f=>/locales|lingui|i18n/.test(f)),scope:'Static dependency audit only. No application execution, secrets, Shopify requests, deletion or merge.'};
          console.log(JSON.stringify(result,null,2));
          JS
      - name: Record audit scope
        if: always()
        working-directory: source
        run: |
          if [ -f translation-audit.json ]; then
            { echo '## Legacy translation audit'; echo '```json'; cat translation-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
