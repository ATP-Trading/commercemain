name: Translation reachability audit

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch pinned PR33 source
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/cleanup/retire-legacy-customer-api-clients
          git checkout --detach eec6a5e00e6c961a4468c365e3f99b7f367253b8
          test "$(git rev-parse HEAD)" = eec6a5e00e6c961a4468c365e3f99b7f367253b8
      - name: Install unchanged locked analysis tools
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Trace every resolved import without running application code
        working-directory: source
        run: |
          set -o pipefail
          node <<'JS' | tee translation-reachability.json
          const fs=require('node:fs'),path=require('node:path'),ts=require('typescript');
          const {execFileSync}=require('node:child_process');
          const root=process.cwd();
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const sourceFiles=tracked.filter(f=>/\.[cm]?[jt]sx?$/.test(f));
          const cfg=ts.readConfigFile('tsconfig.json',ts.sys.readFile);
          const parsed=ts.parseJsonConfigFileContent(cfg.config,ts.sys,root);
          if(cfg.error||parsed.errors.length) throw new Error('Invalid tsconfig');
          const cache=ts.createModuleResolutionCache(root,p=>p,parsed.options);
          const graph=new Map(sourceFiles.map(f=>[f,new Set()]));
          const back=new Map(sourceFiles.map(f=>[f,new Set()]));
          const extra=['components/membership/membership-analytics-dashboard.tsx','components/membership/membership-notifications.tsx','components/search/predictive-search.tsx','components/test/I18nTest.tsx','components/ui/localized-currency.tsx','__tests__/__mocks__/test-providers.tsx'];
          const targets=sourceFiles.filter(f=>f.startsWith('src/i18n/')||extra.includes(f));
          const declarations=[];
          for(const f of sourceFiles){
            const text=fs.readFileSync(f,'utf8');
            const sf=ts.createSourceFile(f,text,ts.ScriptTarget.Latest,true);
            function visit(n){
              if(ts.isStringLiteralLike(n)){
                const r=ts.resolveModuleName(n.text,path.resolve(f),parsed.options,ts.sys,cache).resolvedModule;
                const to=r?path.relative(root,r.resolvedFileName):null;
                if(to&&graph.has(to)){graph.get(f).add(to);back.get(to).add(f);}
              }
              if(extra.includes(f)&&ts.isModuleDeclaration(n))declarations.push({file:f,name:n.name.getText(sf)});
              ts.forEachChild(n,visit);
            }
            visit(sf);
          }
          const roots=sourceFiles.filter(f=>(f.startsWith('app/')&&!/\.(?:test|spec)\./.test(f))||/^(?:src\/)?(?:middleware|proxy|instrumentation|instrumentation-client|next\.config)\.[cm]?[jt]s$/.test(f));
          function closure(starts,g){const found=new Set(starts),todo=[...starts];while(todo.length){for(const n of g.get(todo.pop())||[])if(!found.has(n)){found.add(n);todo.push(n);}}return found;}
          const reachable=closure(roots,graph);
          const names=['PredictiveSearch','I18nTest','I18nErrorBoundary','I18nReady','LocalizedCurrency','MembershipPrice','SavingsAmount','CompactPrice','MembershipAnalyticsDashboard','MembershipNotifications'];
          const mentions=[];
          for(const f of tracked.filter(f=>/\.(?:[cm]?[jt]sx?|md|json|ya?ml|po)$/.test(f)&&!/(?:pnpm-lock\.yaml|package-lock\.json)$/.test(f))){
            const matches=[];
            fs.readFileSync(f,'utf8').split('\n').forEach((line,i)=>{for(const name of names)if(new RegExp('\\b'+name+'\\b').test(line))matches.push({name,line:i+1});});
            if(matches.length)mentions.push({file:f,matches});
          }
          console.log(JSON.stringify({source:'eec6a5e00e6c961a4468c365e3f99b7f367253b8',runtimeRoots:roots.length,sourceFiles:sourceFiles.length,reachable:reachable.size,targets:targets.map(f=>({file:f,reachableFromAppOrFramework:reachable.has(f),importedBy:[...back.get(f)],externalDependencies:[...graph.get(f)].filter(n=>!n.startsWith('src/i18n/')),transitiveDependents:[...closure([f],back)].filter(n=>n!==f&&!n.startsWith('src/i18n/'))})),ambientInExtraCandidates:declarations,mentions,scope:'Static graph; dynamic locale catalog loaders and ambient declarations assessed separately. No source writes or live calls.'},null,2));
          JS
      - name: Save summary
        working-directory: source
        run: |
          { echo '## Translation reachability'; echo '```json'; cat translation-reachability.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
