name: PR33 legacy customer API retirement validation

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch immutable PR33 source and existing review harness
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/cleanup/retire-legacy-customer-api-clients
          git cat-file -e "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx"
          git checkout --detach eec6a5e00e6c961a4468c365e3f99b7f367253b8
          test "$(git rev-parse HEAD)" = eec6a5e00e6c961a4468c365e3f99b7f367253b8
          node <<'JS'
          const {execFileSync} = require('node:child_process');
          const assert = require('node:assert/strict');
          const base = '16a33a143c76e9f74629d115cb0eed2b4f8b9914';
          const list = args => execFileSync('git',args,{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(list(['diff','--name-only',base,'HEAD']),['__tests__/auth/legacy-auth-retirement.test.ts','lib/shopify/customer-account.ts','lib/shopify/customer-account-server.ts'].sort());
          assert.deepEqual(list(['diff','--name-only','--diff-filter=D',base,'HEAD']),['lib/shopify/customer-account.ts','lib/shopify/customer-account-server.ts'].sort());
          assert.deepEqual(list(['diff','--name-only',base,'HEAD','--','app','components','hooks','src','package.json','pnpm-lock.yaml','next.config.ts','tsconfig.json','lib/shopify/customer-account-oauth.ts','lib/types/browser-analytics.d.ts']),[]);
          console.log('PASS: only two dead customer API modules removed and retirement test extended; all live routes, hooks, UI, OAuth types and settings unchanged.');
          JS
      - name: Install unchanged locked dependencies without lifecycle scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts
      - name: Prepare isolated no-network tests and truthful reporting
        id: prepare
        working-directory: source
        run: |
          cat > .pr33-no-network.cjs <<'JS'
          const fail = () => { throw new Error('PR33_TEST_NETWORK_BLOCKED: mock external requests'); };
          for (const name of ['node:http','node:https']) {
            const transport = require(name); transport.request = fail; transport.get = fail;
          }
          const net = require('node:net'); net.connect = fail; net.createConnection = fail;
          require('node:tls').connect = fail;
          globalThis.fetch = async () => fail();
          JS
          cat > .pr33-summary.cjs <<'JS'
          const fs = require('node:fs');
          const file = process.argv[2];
          if (!fs.existsSync(file)) { console.error('RESULT_FILE_MISSING',file); process.exit(1); }
          const r = JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({report:file,success:r.success,files:r.testResults.length,
            tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,
            failedFiles:r.testResults.filter(f=>f.status==='failed').map(f=>({file:f.name.split('/source/').pop(),message:(f.message||'').slice(0,1200),
              assertions:f.assertionResults.filter(a=>a.status==='failed').map(a=>({name:a.fullName,errors:a.failureMessages.map(m=>m.slice(0,1200))}))}))},null,2));
          JS
      - name: Run all previously selected auth cart analytics RTL and navigation tests
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr33-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/seo/navigation-url.test.ts --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=pr33-results.json >pr33-validation.log 2>&1
          result=$?
          node .pr33-summary.cjs pr33-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr33-validation.log; fi
          exit "$result"
      - name: Repeat extended retirement checks with shuffled execution order
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr33-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth/legacy-auth-retirement.test.ts --sequence.shuffle --sequence.seed=3301 --reporter=json --outputFile=pr33-shuffled-results.json >pr33-shuffled.log 2>&1
          result=$?
          node .pr33-summary.cjs pr33-shuffled-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr33-shuffled.log; fi
          exit "$result"
      - name: Recheck actual EN AR login and mobile-menu interactions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set -eu
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr33-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --reporter=json --outputFile=pr33-ui-results.json >pr33-ui.log 2>&1
          result=$?
          node .pr33-summary.cjs pr33-ui-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr33-ui.log; fi
          exit "$result"
      - name: Record exact scope without suppressing failures
        if: always()
        working-directory: source
        run: |
          {
            echo '## PR33 customer API retirement validation'
            echo 'Exact source: eec6a5e00e6c961a4468c365e3f99b7f367253b8; base: PR32 16a33a1.'
            echo 'No merchant secrets, live service calls, purchases, customer changes, merges or Production promotion.'
            echo 'Isolated actual-source regression coverage, not a deployed-preview browser or real OAuth checkout test.'
            for report in pr33-results.json pr33-shuffled-results.json pr33-ui-results.json; do
              echo '```json'
              if [ -f "$report" ]; then node .pr33-summary.cjs "$report"; else echo "RESULT_FILE_MISSING $report"; fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
