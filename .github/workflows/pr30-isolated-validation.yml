name: PR34 legacy translation UI validation

on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr30-isolated-validation.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch exact source and existing review harness without merchant credentials
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git config maintenance.auto false
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/cleanup/retire-unused-lingui-ui
          git cat-file -e "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx"
          git checkout --detach 0d71a61ba3626faed096911d15bdda90432f49a8
          test "$(git rev-parse HEAD)" = 0d71a61ba3626faed096911d15bdda90432f49a8
          node <<'JS'
          const {execFileSync} = require('node:child_process');
          const assert = require('node:assert/strict');
          const base = 'eec6a5e00e6c961a4468c365e3f99b7f367253b8';
          const removed = ['components/membership/membership-analytics-dashboard.tsx','components/membership/membership-notifications.tsx','components/search/predictive-search.tsx','components/test/I18nTest.tsx','components/ui/localized-currency.tsx','src/i18n/I18nErrorBoundary.tsx','src/i18n/I18nReady.tsx','src/i18n/safe-translate.ts'].sort();
          const added = ['__tests__/i18n/current-request-config.test.ts','__tests__/i18n/legacy-ui-retirement.test.ts'].sort();
          const list = args => execFileSync('git',args,{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(list(['diff','--name-only',base,'HEAD']),[...removed,...added].sort());
          assert.deepEqual(list(['diff','--name-only','--diff-filter=D',base,'HEAD']),removed);
          assert.deepEqual(list(['diff','--name-only','--diff-filter=A',base,'HEAD']),added);
          assert.deepEqual(list(['diff','--name-only','--diff-filter=M',base,'HEAD']),[]);
          console.log('PASS: only eight audited orphan files removed and two regression files added. All other source, existing tests, live translations, dependencies and settings are unchanged.');
          JS
      - name: Install the unchanged frozen dependency lockfile without lifecycle scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Prepare no-network test process and result reporting
        id: prepare
        working-directory: source
        run: |
          cat > .pr34-no-network.cjs <<'JS'
          const fail = () => { throw new Error('PR34_TEST_NETWORK_BLOCKED: mock external requests'); };
          for (const name of ['node:http','node:https']) {
            const transport = require(name); transport.request = fail; transport.get = fail;
          }
          const net = require('node:net'); net.connect = fail; net.createConnection = fail;
          require('node:tls').connect = fail;
          globalThis.fetch = async () => fail();
          JS
          cat > .pr34-summary.cjs <<'JS'
          const fs = require('node:fs');
          const file = process.argv[2];
          if (!fs.existsSync(file)) { console.error('RESULT_FILE_MISSING',file); process.exit(1); }
          const r = JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({report:file,success:r.success,files:r.testResults.length,
            tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,
            failedFiles:r.testResults.filter(f=>f.status==='failed').map(f=>({file:f.name.split('/source/').pop(),message:(f.message||'').slice(0,1400),
              assertions:f.assertionResults.filter(a=>a.status==='failed').map(a=>({name:a.fullName,errors:a.failureMessages.map(m=>m.slice(0,1400))}))}))},null,2));
          JS
      - name: Run existing regression scope plus current request-loader and retirement tests
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr34-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/auth __tests__/cart __tests__/analytics __tests__/rtl __tests__/seo/navigation-url.test.ts __tests__/i18n/current-request-config.test.ts __tests__/i18n/legacy-ui-retirement.test.ts --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile=pr34-results.json >pr34-validation.log 2>&1
          result=$?
          node .pr34-summary.cjs pr34-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr34-validation.log; fi
          exit "$result"
      - name: Repeat new translation checks with shuffled order
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr34-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/i18n/current-request-config.test.ts __tests__/i18n/legacy-ui-retirement.test.ts --sequence.shuffle --sequence.seed=3401 --reporter=json --outputFile=pr34-shuffled-results.json >pr34-shuffled.log 2>&1
          result=$?
          node .pr34-summary.cjs pr34-shuffled-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr34-shuffled.log; fi
          exit "$result"
      - name: Recheck twelve actual EN AR login and mobile-menu interactions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set -eu
          mkdir -p __tests__/review
          git show "$GITHUB_SHA:__tests__/review/pr30-auth-ui.test.tsx" > __tests__/review/pr30-auth-ui.test.tsx
          set +e
          export NODE_OPTIONS="--require=$(pwd)/.pr34-no-network.cjs"
          ./node_modules/.bin/vitest run __tests__/review/pr30-auth-ui.test.tsx --maxWorkers=2 --reporter=json --outputFile=pr34-ui-results.json >pr34-ui.log 2>&1
          result=$?
          node .pr34-summary.cjs pr34-ui-results.json
          if [ "$result" -ne 0 ]; then tail -n 100 pr34-ui.log; fi
          exit "$result"
      - name: Record scope and outcomes without suppressing failures
        if: always()
        working-directory: source
        run: |
          {
            echo '## PR34 legacy translation UI validation'
            echo 'Source: 0d71a61ba3626faed096911d15bdda90432f49a8; parent: PR33 eec6a5e.'
            echo 'No merchant secrets, customer changes, real orders, merge or Production promotion.'
            echo 'Selected isolated actual-source tests, not a complete repository suite or deployed-preview browser, CSS, real OAuth or checkout validation.'
            echo 'Legacy Lingui-specific test suites and shared declarations are retained for a separate cleanup; they are not included in this selected run.'
            for report in pr34-results.json pr34-shuffled-results.json pr34-ui-results.json; do
              echo '```json'
              if [ -f "$report" ]; then node .pr34-summary.cjs "$report"; else echo "RESULT_FILE_MISSING $report"; fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
