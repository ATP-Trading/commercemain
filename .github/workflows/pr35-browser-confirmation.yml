name: PR35 browser confirmation against Preview and Production
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr35-browser-confirmation.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Fetch immutable source and verification scripts
        run: |
          set -eu
          git init source
          cd source
          git config gc.auto 0
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch --no-auto-maintenance origin refs/heads/test/pr30-isolated-validation refs/heads/cleanup/retire-lingui-runtime
          git checkout --detach 060397c03cdac89614b4ddd9f0569beff83c7aeb
          git show "$GITHUB_SHA:__tests__/review/pr35-deployed-browser.cjs" > .pr35-browser.cjs
          git show "$GITHUB_SHA:__tests__/review/pr35-browser-confirmation.cjs" > .pr35-confirmation.cjs
      - name: Install unchanged pinned tooling and Chromium
        working-directory: source
        run: |
          npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Generate ephemeral public handshake
        working-directory: source
        run: node .pr35-browser.cjs handshake
      - name: Upload public key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-confirmation-public-handshake
          path: source/preview-public-handshake.json
          retention-days: 1
          if-no-files-found: error
      - name: Confirm actual menu controls and compare membership redirects
        working-directory: source
        run: node .pr35-confirmation.cjs
      - name: Remove ephemeral private key
        if: always()
        run: rm -f "$RUNNER_TEMP/pr35-preview-private.pem"
      - name: Upload sanitized public storefront evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-browser-confirmation-evidence
          path: source/confirmation-evidence/
          retention-days: 1
          if-no-files-found: error
