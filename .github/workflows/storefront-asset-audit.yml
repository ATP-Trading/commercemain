name: Read-only storefront asset audit
'on':
  push:
    branches: [test/storefront-asset-audit-20260922]
    paths: [.github/workflows/storefront-asset-audit.yml]
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install isolated browser
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install --disable-pip-version-check playwright==1.57.0
          .audit-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify live assets and consent UI while retaining blocked-runtime diagnostics
        run: |
          .audit-venv/bin/python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlsplit, urlunsplit
          from playwright.sync_api import sync_playwright

          BASE = 'https://www.atpgroupservices.ae'
          PATHS = ['/en', '/ar', '/en/product/mores-collagen', '/ar/product/mores-collagen']
          def clean(url):
              u = urlsplit(url)
              return urlunsplit((u.scheme, u.netloc, u.path, '', ''))
          def asset(url):
              return url.startswith(BASE + '/_next/static/')
          def valid(a):
              mime = a['type'].lower()
              return a['status'] == 200 and (('javascript' in mime or 'ecmascript' in mime) if a['url'].endswith('.js') else 'text/css' in mime if a['url'].endswith('.css') else True)
          def audit(browser, path):
              ar = path.startswith('/ar')
              r = {'path': path, 'status': None, 'assets': [], 'asset_failures': [], 'page_errors': [], 'blocked_requests': [], 'consent_ui': False, 'h1_visible': False}
              context = browser.new_context(viewport={'width': 1365, 'height': 900}, service_workers='block')
              context.add_init_script("""try {
                for (const k of ['atp-analytics-consent', 'atp-marketing-consent', 'atp-google-ads-consent-v1']) localStorage.setItem(k, 'denied');
                window['ga-disable-G-N47GG1EVK5'] = true;
              } catch (_) {}""")
              def guard(route):
                  req = route.request
                  u = urlsplit(req.url)
                  permitted = u.hostname in ['www.atpgroupservices.ae', 'cdn.shopify.com', 'fonts.googleapis.com', 'fonts.gstatic.com']
                  tracking = u.path in ['/collect', '/g/collect', '/j/collect'] or u.path.startswith(('/_vercel/insights', '/_vercel/speed-insights'))
                  if req.method not in ['GET', 'HEAD'] or not permitted or tracking:
                      r['blocked_requests'].append({'method': req.method, 'url': clean(req.url), 'next_action': bool(req.headers.get('next-action'))})
                      route.abort()
                  else:
                      route.continue_()
              context.route('**/*', guard)
              page = context.new_page()
              closing = False
              def on_response(response):
                  if asset(response.url):
                      r['assets'].append({'url': clean(response.url), 'status': response.status, 'type': response.headers.get('content-type', ''), 'source': 'browser'})
              def on_failure(req):
                  if asset(req.url) and not closing:
                      r['asset_failures'].append({'url': clean(req.url), 'error': req.failure})
              page.on('response', on_response)
              page.on('requestfailed', on_failure)
              page.on('pageerror', lambda e: r['page_errors'].append({'message': str(e)[:300], 'stack': e.stack[:1200]}))
              references = []
              try:
                  response = page.goto(BASE + path, wait_until='load', timeout=30000)
                  r['status'] = response.status if response else None
                  r['final_url'] = clean(page.url)
                  r['title'] = page.title()
                  references = page.locator('script[src], link[rel="stylesheet"]').evaluate_all("els => [...new Set(els.map(e => e.src || e.href))].filter(u => u.includes('/_next/static/'))")
                  r['nomodule_references'] = page.locator('script[nomodule][src]').evaluate_all('els => els.map(e => e.src)')
                  r['inline_style_count'] = page.locator('style').count()
                  settings = 'تفضيلات التحليلات' if ar else 'Analytics preferences'
                  page.get_by_role('button', name=settings, exact=True).last.click(timeout=10000)
                  banner = page.locator(f'section[aria-label="{settings}"]')
                  banner.wait_for(state='visible', timeout=5000)
                  banner.get_by_role('button', name='رفض' if ar else 'Decline', exact=True).click(timeout=5000)
                  banner.wait_for(state='hidden', timeout=5000)
                  r['consent_ui'] = True
                  # Responsive layouts may have a hidden mobile heading before the visible desktop heading.
                  page.locator('h1:visible').first.wait_for(state='visible', timeout=5000)
                  r['h1_visible'] = True
              except Exception as exc:
                  r['ui_or_navigation_error'] = str(exc)[:600]
              try:
                  r['headings'] = [{'text': h.inner_text()[:160], 'visible': h.is_visible()} for h in page.locator('h1').all()]
                  observed = {a['url'] for a in r['assets']}
                  missing = [u for u in references if clean(u) not in observed]
                  if len(missing) > 10:
                      raise RuntimeError('Too many unobserved references; refusing an unbounded audit')
                  # Modern Chromium skips nomodule scripts; verify their exact static URLs with GET.
                  # This checks availability only and does not execute their contents.
                  for url in missing:
                      if not asset(url):
                          raise RuntimeError('Reference outside the allowed static origin')
                      response = context.request.get(url, timeout=10000, max_redirects=0)
                      r['assets'].append({'url': clean(url), 'status': response.status, 'type': response.headers.get('content-type', ''), 'source': 'direct-static-get'})
                      response.dispose()
              except Exception as exc:
                  r['verification_error'] = str(exc)[:500]
              finally:
                  closing = True
                  context.close()
              seen = {a['url'] for a in r['assets']}
              missing = [clean(u) for u in references if clean(u) not in seen]
              r['asset_count'] = len(r['assets'])
              r['bad_assets'] = [a for a in r['assets'] if not valid(a)]
              r['unverified_references'] = missing
              r['assets_ok'] = bool(r['status'] == 200 and r['assets'] and not r['bad_assets'] and not r['asset_failures'] and not missing and not r.get('verification_error'))
              r['assets_ui_ok'] = bool(r['assets_ok'] and r['consent_ui'] and r['h1_visible'] and r.get('inline_style_count', 0) > 0)
              # Do not conceal or call the intentionally constrained runtime a clean functional test.
              r['unrestricted_runtime_verified'] = False
              del r['assets']
              return r
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  for path in PATHS:
                      result = audit(browser, path)
                      results.append(result)
                      print('ATP_ASSET_AUDIT ' + json.dumps(result, ensure_ascii=False), flush=True)
              finally:
                  browser.close()
          summary = {'checked_at': datetime.now(timezone.utc).isoformat(), 'scope': 'ASSETS_AND_CONSENT_UI_ONLY_NO_PURCHASE_NO_ANALYTICS', 'asset_ui_passed': sum(r['assets_ui_ok'] for r in results), 'total': len(results), 'runtime_diagnostics_retained': True}
          print('ATP_AUDIT_SUMMARY ' + json.dumps(summary), flush=True)
          raise SystemExit(0 if all(r['assets_ui_ok'] for r in results) else 1)
          PY
