name: PR40 restore lint policy diagnostic
on:
  push:
    branches: [test/pr30-isolated-validation]
    paths: [.github/workflows/pr40-lint-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Read exact source without merchant credentials
        run: |
          set -eu
          git init source; cd source
          git remote add origin https://github.com/ATP-Trading/commercemain.git
          git fetch origin refs/heads/cleanup/retire-custom-membership-engine
          git checkout --detach 3b71e4f5cf9b1d51ca8c591c18aa84be5b4eb95c
          mkdir -p ../evidence
      - name: Install unchanged frozen tools without lifecycle scripts
        working-directory: source
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Restore equivalent existing rules only in disposable checkout
        working-directory: source
        run: |
          cat > eslint.config.mjs <<'JS'
          import { createRequire } from 'node:module';
          import { fileURLToPath } from 'node:url';
          import path from 'node:path';
          const require = createRequire(import.meta.url);
          const eslintRequire = createRequire(require.resolve('eslint/package.json'));
          const { FlatCompat } = eslintRequire('@eslint/eslintrc');
          const compat = new FlatCompat({ baseDirectory: path.dirname(fileURLToPath(import.meta.url)) });
          export default [
            { ignores: ['**/node_modules/**', '.next/**', 'out/**', 'build/**', 'coverage/**', 'test-results/**', 'playwright-report/**', 'next-env.d.ts'] },
            ...compat.extends('next/core-web-vitals', 'next/typescript'),
          ];
          JS
          node <<'JS'
          const fs=require('node:fs'),{createRequire}=require('node:module');
          const er=createRequire(require.resolve('eslint/package.json'));
          fs.writeFileSync('../evidence/compat-version.json',JSON.stringify({version:er('@eslint/eslintrc/package.json').version},null,2));
          JS
      - name: Run complete lint with original rule severities and preserve failures
        working-directory: source
        run: |
          set +e
          ./node_modules/.bin/eslint . --no-fix --format json --output-file ../evidence/lint.json >../evidence/lint.log 2>&1
          code=$?
          echo "$code" > ../evidence/lint-exit.txt
          node <<'JS'
          const fs=require('node:fs');
          if(!fs.existsSync('../evidence/lint.json'))process.exit(1);
          const r=JSON.parse(fs.readFileSync('../evidence/lint.json','utf8')),rules={};
          for(const f of r) for(const m of f.messages){const k=String(m.ruleId);rules[k]??={errors:0,warnings:0};rules[k][m.severity===2?'errors':'warnings']++;}
          const summary={files:r.length,errors:r.reduce((n,f)=>n+f.errorCount,0),warnings:r.reduce((n,f)=>n+f.warningCount,0),rules};
          fs.writeFileSync('../evidence/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          JS
          exit "$code"
      - name: Preserve actual diagnostics even when lint fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr40-lint-diagnostic
          path: evidence/
          retention-days: 3
          if-no-files-found: error
